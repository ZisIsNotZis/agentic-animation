episode:
  id: showcase_props
  title: 展示：道具拿取与交接
  language: zh-CN

# Minimal showcase: object-subject prop choreography — pickup, handover
# between actors, putdown with support settling.

actors:
  lin:
    use: figure/lin
    voice: voice/zh/lin
  awei:
    use: figure/awei
    voice: voice/zh/awei

locations:
  canteen:
    use: set/school_canteen

objects:
  thermos:
    use: prop/thermos

scenes:
  - id: props
    location: canteen
    actors:
      lin: {facing: awei}
      awei: {facing: lin}
    objects:
      thermos: center
    script:
      - lin: "{prop.pickup(lin, thermos)}你的保温杯，捡到了。"
      - lin: "{prop.handover(lin, thermos, awei)}给。"
      - awei: "{prop.putdown(awei, thermos, lin)}谢了，先放你桌上。"
