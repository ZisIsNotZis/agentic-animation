episode:
  id: bailan_system
  title: 摆烂系统：躺着也能无敌？
  language: zh-CN
actors:
  lin:
    use: figure.lin.v1 # asset pass: exhausted modern worker reborn in a loose Qingyun outer-disciple robe; sleep-deprived eyes, deliberately slack posture
    voice: voice.zh.lin.v1 # asset pass: dry, low-energy Mandarin delivery with sharp deadpan punchlines
  senior:
    use: figure.senior.v1 # asset pass: immaculate young sword cultivator; rigid posture, bright training uniform, visibly overworked expression
    voice: voice.zh.senior.v1 # asset pass: fast, earnest Mandarin delivery that escalates into frustrated shouting
  elder:
    use: figure.elder.v1 # asset pass: severe Qingyun elder with white brows, dark ceremonial robe, raised staff, and controlled authority
    voice: voice.zh.elder.v1 # asset pass: slow resonant Mandarin elder voice; formal diction, then startled loss of composure
  system:
    use: figure.system_orb.v1 # asset pass: floating jade interface orb with a single expressive glyph-face; no humanoid body
    voice: voice.zh.system.v1 # asset pass: clean neutral Mandarin synthetic voice with precise notification timing
locations:
  dormitory:
    use: set.qingyun_dormitory.v1 # asset pass: cramped Qingyun outer-disciple room, low wooden bed, paper window, talisman lamp, and one repairable desk
  courtyard:
    use: set.qingyun_courtyard.v1 # asset pass: sunlit sect courtyard with stone practice rings, old cedar, notice wall, and distant tiled roofs
  arena:
    use: set.qingyun_arena.v1 # asset pass: stepped cultivation arena with boundary stones, mountain mist beyond, and a clearly readable central duel space
objects:
  desk:
    use: prop.desk.v1
  thermos:
    use: prop.thermos.v1
  scroll:
    use: prop.scroll.v1
  skill_bottle:
    use: prop.skill_bottle.v1
  skill_cards:
    use: prop.skill_cards.v1
  screen:
    use: dressing.computer_screen.v1
scenes:
  - id: awakening
    location: dormitory
    actors:
      lin: {facing: audience}
      system: {facing: audience}
    objects:
      desk: center
      scroll: on(desk)
      screen: right
    script:
      - lin: "{lin.act.collapse(), lin.face.confused()}这是哪儿？"
      - lin: "{lin.act.touch_hair()}我怎么穿着窗帘？"
      - lin: 这不是我那张加班到凌晨的脸。
      - lin: "{lin.look.audience()}系统，出来解释一下。"
      - system: "{vfx.use.ai_glitch(screen), sfx.play.static_buzz()}检测到极致摆烂心态，契合度百分之百。"
      - system: 逆天摆烂系统绑定成功。
      - lin: "{lin.act.sip(thermos), lin.face.relief()}哦？别人穿越送外挂。"
      - lin: 这个外挂先送我一张床，懂事。
      - system: 本系统规则简单粗暴：拒绝内卷，拒绝苦修。
      - system: 只要持续摆烂、摸鱼、躺平，即可自动突破境界，解锁神技，获得宝物。
      - system: 新手任务：彻底放弃今日修炼，原地躺平一小时。
      - system: 任务奖励：炼气九层巅峰修为。
      - lin: "{lin.face.excited()}一小时？"
      - lin: "{lin.act.collapse(), lin.face.relief()}这不是任务，这是组织关怀。"
      - system: 请宿主不要把懒惰包装成战略。
      - lin: "{lin.face.laughing()}你这系统说话怎么比老板还像老板？不过我喜欢。"
  - id: memory_reveal
    location: dormitory
    actors:
      lin: {facing: audience}
      system: {facing: audience}
    objects:
      desk: center
      thermos: on(desk)
      scroll: on(desk)
      screen: right
    script:
      - lin: "{lin.act.tap_head(), lin.face.confused()}等等，我好像想起来了。"
      - lin: 原主是青云宗最底层的外门弟子。
      - lin: 资质差，修炼慢，还天天被人叫废物。
      - lin: "{lin.face.desperate()}昨天他为了赶上早课，修炼过度，直接累晕了。"
      - lin: 然后我就穿过来了。
      - lin: "{lin.face.relief()}这不是夺舍，这是替他办理工伤离职。"
      - system: 记忆检索完成。
      - system: 原宿主最后一项未完成事务：今日修炼四个时辰。
      - lin: "{lin.face.shocked()}四个时辰？"
      - lin: "{lin.act.collapse()}这不是修炼，这是连续加班。"
      - system: 是否现在补完未完成事务？
      - lin: 当然不补。
      - lin: "{lin.face.calm()}人都累没了，还补什么？"
      - system: 判定为主动放弃努力。
      - lin: 主动放弃说得真好听。
      - lin: 我这叫尊重身体的客观规律。
      - system: 记录：宿主擅长为懒惰寻找理论依据。
      - lin: "{lin.face.proud()}谢谢夸奖，这是我唯一稳定的天赋。"
      - system: 天赋确认：摆烂。
      - lin: 这个名字听起来就很有前途。
      - lin: "{lin.look.audience()}从今天起，谁也别想让我内卷。"
  - id: task_timer
    location: dormitory
    actors:
      lin: {facing: audience}
      system: {facing: audience}
    objects:
      desk: center
      thermos: on(desk)
      scroll: on(desk)
      screen: right
    script:
      - system: 新手任务开始：原地躺平一小时。
      - lin: "{lin.act.collapse(), lin.face.relief()}一小时而已，眼睛一闭就过去了。"
      - system: 禁止修炼。
      - lin: 这条不用提醒。
      - system: 禁止练剑。
      - lin: 我连剑在哪里都不知道。
      - system: 禁止思考如何变强。
      - lin: 这个更简单，我从来不想。
      - system: 禁止主动寻找任务。
      - lin: "{lin.act.sip(thermos)}终于有一项我擅长的工作了。"
      - system: 当前摆烂进度：百分之十。
      - lin: 才百分之十？
      - lin: "{lin.face.desperate()}我已经躺得这么有诚意了。"
      - system: 进度取决于心态，不取决于床的舒适程度。
      - lin: 那我把心态也放平。
      - lin: "{lin.act.collapse(), lin.face.calm()}身体和灵魂一起关机。"
      - system: 当前摆烂进度：百分之三十。
      - lin: "{lin.look.audience()}修仙界的计时器还挺严格。"
      - system: 检测到宿主试图通过聊天消磨任务时间。
      - lin: 这也算一种工作流优化。
      - system: 记录：狡辩行为不影响任务判定。
      - lin: 那就继续。
      - lin: "{lin.face.relief()}我负责躺，你负责播报。"
  - id: task_completion
    location: dormitory
    actors:
      lin: {facing: audience}
      system: {facing: audience}
    objects:
      desk: center
      thermos: on(desk)
      screen: right
    script:
      - system: 当前摆烂进度：百分之九十九。
      - lin: "{lin.face.excited()}还有百分之一？"
      - system: 请宿主保持原姿势，不要提前庆祝。
      - lin: 我连庆祝都嫌累。
      - lin: "{lin.act.collapse()}这下你满意了吧。"
      - system: 任务完成。
      - system: 摆烂时长达标，奖励发放。
      - lin: "{lin.face.shocked()}等等，真的有奖励？"
      - system: 炼气一层突破至炼气九层巅峰。
      - lin: "{lin.face.excited()}我什么都没做，就升级了？"
      - system: 更正：你完成了持续不做任何事。
      - lin: 这才是专业。
      - system: 获得被动效果：低功耗修炼。
      - lin: 这个名字比我本人还稳定。
      - system: 获得防护效果：不想动就不会受伤。
      - lin: "{lin.face.proud()}这不就是我一直以来的生活哲学？"
      - system: 生活哲学已转化为修行能力。
      - lin: "{lin.look.audience()}原来废柴不是资质，是没有找到正确的偷懒方法。"
      - system: 请不要传播危险的成功经验。
      - lin: 放心，我只在有天赋的人面前炫耀。
      - lin: "{lin.act.sip(thermos), lin.face.relief()}比如我自己。"
  - id: courtyard_crowd
    location: courtyard
    actors:
      lin: {facing: senior}
      senior: {facing: lin}
      system: {facing: audience}
    objects:
      desk: center
      thermos: on(desk)
      scroll: on(desk)
      screen: right
    script:
      - lin: "{lin.move.to(desk), lin.act.stand()}外面的太阳果然比屋里亮。"
      - lin: "{lin.face.relief()}晒一晒，修为应该还能自己长。"
      - senior: "{senior.act.enter(), senior.face.skeptical()}你还真敢出来。"
      - senior: 别人清晨练剑，你抱着茶壶晒太阳。
      - lin: "{lin.act.sip(thermos)}茶壶也是法器，不能歧视生活用品。"
      - senior: 外门弟子每天必须完成四个时辰的修炼。
      - lin: 我昨天已经替大家验证过了。
      - lin: "{lin.face.desperate()}修炼过度会晕倒，建议宗门立刻整改。"
      - senior: 你是在给自己的懒惰找借口。
      - lin: 我是在用生命做风险评估。
      - senior: "{senior.face.desperate()}你知道我每天练剑多少次吗？"
      - lin: 不知道。
      - lin: "{lin.face.calm()}但我知道你每天至少后悔一次。"
      - senior: 住口！
      - system: 检测到高强度争执。
      - system: 建议宿主采用最低能耗回应。
      - lin: "{lin.act.collapse()}好的。"
      - senior: 你给我站起来！
      - lin: 站起来会消耗体力。
      - lin: 体力应该留给更重要的事情。
      - senior: 什么事情比修炼更重要？
      - lin: "{lin.face.proud()}午睡。"
      - system: 回答符合摆烂系统核心价值。
  - id: first_slap_setup
    location: courtyard
    actors:
      lin: {facing: senior}
      senior: {facing: lin}
      system: {facing: audience}
    objects:
      desk: center
      scroll: on(desk)
      screen: right
    script:
      - senior: "{senior.face.desperate()}今日我就替宗门清理你这个害群之马。"
      - lin: 清理之前能不能先说清楚赔偿标准？
      - senior: 同门切磋，生死自负。
      - lin: "{lin.face.confused()}那我申请只负睡眠责任。"
      - senior: 少废话！
      - senior: "{senior.act.present(scroll)}拔剑！"
      - lin: 我没有剑。
      - senior: 那就空手接剑！
      - lin: "{lin.face.calm()}空手接剑听起来很不环保。"
      - system: 发现攻击意图。
      - system: 建议宿主保持放松。
      - lin: 我一直很放松。
      - senior: "{senior.face.desperate()}你根本没有把我放在眼里！"
      - lin: "{lin.look.at(senior)}我把你放在眼里了。"
      - lin: 但我的身体不想配合。
      - senior: 这就让你看看筑基修士的力量！
      - lin: "{lin.act.collapse()}看可以，别要求我鼓掌。"
      - system: 目标心率稳定。
      - system: 摆烂判定持续有效。
      - lin: "{lin.face.relief()}那我就继续躺着了。"
  - id: first_slap
    location: courtyard
    actors:
      lin: {facing: senior}
      senior: {facing: lin}
      system: {facing: audience}
    objects:
      desk: center
      thermos: on(desk)
      screen: right
    script:
      - lin: "{lin.act.collapse()}"
      - senior: "{senior.act.enter(), senior.face.skeptical()}林摆摆！全宗门弟子都在刻苦修炼，唯独你整日偷懒躺平。资质本就废物，还如此懒惰，这辈子注定止步外门。"
      - lin: "{lin.face.calm(), lin.look.at(senior)}你说得对，但我现在躺得很舒服。"
      - senior: 修仙之路不进则退，你连这点道理都不懂？
      - lin: "{lin.act.touch_hair()}道理我懂，主要是腿不想动。"
      - senior: "{senior.face.desperate(), senior.act.present(scroll)}冥顽不灵，今天我就让你知道偷懒的下场。接我一剑。"
      - lin: "{lin.act.stand(), lin.face.calm()}你劈你的，我躺我的，别耽误我晒太阳。"
      - senior: "{senior.act.slam(desk), vfx.use.screen_error(screen)}给我破！"
      - system: "{vfx.use.ai_glitch(screen)}新手任务完成，摆烂时长达标。奖励发放，炼气一层突破至炼气九层巅峰。"
      - lin: "{lin.face.excited()}哎呀，怎么突然感觉空气变轻了？"
      - senior: "{senior.face.shocked()}不可能，我的筑基剑气！"
      - lin: "{lin.face.satisfied()}可能是你太用力，把剑气累没了。"
  - id: arena
    location: arena
    actors:
      lin: {facing: senior}
      senior: {facing: lin}
      system: {facing: audience}
    objects:
      desk: center
      scroll: on(desk)
      screen: right
      skill_bottle: on(desk)
    script:
      - lin: "{lin.move.to(senior), lin.act.stand()}"
      - senior: "{senior.face.desperate()}刚才那一剑只是试探，我真正的实力还没有发挥出来。"
      - lin: 那你继续试探，我负责站着。
      - senior: "{senior.act.present(scroll)}接下来是三连剑气，看你还能不能装。"
      - lin: 可以，不过我建议你先坐下来喘口气。
      - senior: "{senior.act.count_three(), senior.face.desperate()}少废话，给我开！"
      - lin: 这个动作挺标准，就是表情有点加班。
      - senior: 为什么剑气靠近你就没了？
      - lin: 因为它们也想摆烂。
      - system: "{vfx.use.ai_glitch(screen)}检测到宿主持续摆烂，摆烂值加九百九十九，解锁被动技能，万物不侵。"
      - lin: "{lin.face.proud()}原来不努力也有不努力的好处。"
      - senior: "{senior.face.shocked()}我苦修十年，竟然打不过一个躺着的人？"
      - lin: 不要污蔑，我刚才有站着，已经很努力了。
  - id: elder_pressure
    location: arena
    actors:
      lin: {facing: elder}
      senior: {facing: lin}
      elder: {facing: lin}
      system: {facing: audience}
    objects:
      desk: center
      thermos: on(desk)
      screen: right
    script:
      - elder: "{elder.act.enter(), elder.face.somber()}演武场不是你睡觉的地方，林摆摆，你竟敢敷衍同门切磋。大师兄刻苦修炼，而你好吃懒做，毫无进取之心。"
      - lin: "{lin.face.calm()}长老，我这不叫敷衍，叫低功耗运行。"
      - elder: "{elder.face.somber()}还敢顶嘴？今日我便用威压，让你知道什么叫修行。"
      - lin: 能不能轻一点？我这人抗压能力一般，主要抗拒加班。
      - system: "{vfx.use.screen_error(screen)}检测到外力施压，宿主保持摆烂心态不慌不忙，超额完成摆烂判定。奖励发放，修为突破筑基中期，全面碾压当前施压者。"
      - lin: "{lin.face.satisfied()}长老，你这个推拿手法不错，再加一点。"
      - elder: "{elder.face.shocked()}你你你，怎么可能？我的威压竟然被你身上的气息顶回来了。"
      - senior: 长老，他刚才是不是又升级了？
      - elder: "{elder.face.confused()}闭嘴，我现在也需要想一会儿。"
  - id: collapse
    location: dormitory
    actors:
      lin: {facing: senior}
      senior: {facing: lin}
      elder: {facing: lin}
      system: {facing: audience}
    objects:
      desk: center
      scroll: on(desk)
    script:
      - lin: "{lin.face.calm()}我都说了，修炼没用，躺平才是王道。你们非要卷，卷到最后还不如我天天睡觉。"
      - senior: "{senior.act.collapse(), senior.face.desperate()}我每天苦修十个时辰，勤练不辍，为什么不如一个摆烂废物？"
      - lin: 有没有一种可能，你把自己练得太累了，已经没有力气赢我。
      - senior: 不，我不信，我的青春、汗水、黑眼圈，全都不算数吗？
      - lin: 黑眼圈算，算你睡眠不足。
      - elder: "{elder.face.thoughtful()}林摆摆，你究竟是什么修为？"
      - lin: 不知道，系统没让我查，查境界也挺卷的。
      - system: "{vfx.use.ai_glitch(screen)}宿主摆烂天赋逆天，超额完成单日摆烂任务。终极奖励预告，持续摆烂三日，解锁金丹修为，获得神级摆烂神通。"
      - lin: "{lin.face.excited()}三日？看来以后，我要好好摆烂了。"
      - system: 请宿主保持初心。
      - lin: "{lin.face.laughing(), camera.use.wide()}放心，我连初心都懒得找。"
