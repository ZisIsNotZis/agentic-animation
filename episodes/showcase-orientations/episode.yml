episode:
  id: showcase_orientations
  title: "八向朝向 / Eight orientations"
  language: zh
locations:
  canteen:
    use: set/school_canteen
actors:
  # ONE person shown in eight directions. All instance ids hash to the same
  # role palette (lin_a..lin_v share a charcode sum mod 3), so the wardrobe
  # is identical across every view by construction.
  lin_a:
    use: figure/lin
    voice: voice/zh/lin
  lin_d:
    use: figure/lin
    voice: voice/zh/lin
  lin_g:
    use: figure/lin
    voice: voice/zh/lin
  lin_j:
    use: figure/lin
    voice: voice/zh/lin
  lin_m:
    use: figure/lin
    voice: voice/zh/lin
  lin_p:
    use: figure/lin
    voice: voice/zh/lin
  lin_s:
    use: figure/lin
    voice: voice/zh/lin
  lin_v:
    use: figure/lin
    voice: voice/zh/lin
objects: {}
scenes:
  - id: orientations
    location: canteen
    actors:
      lin_a: {facing: right}
      lin_d: {facing: right}
      lin_g: {facing: right}
      lin_j: {facing: right}
      lin_m: {facing: right}
      lin_p: {facing: right}
      lin_s: {facing: right}
      lin_v: {facing: right}
    objects: {}
    script:
      - lin_a: "{pose.orient(lin_a, \"front\")}"
      - lin_d: "{pose.orient(lin_d, \"front-right\")}"
      - lin_g: "{pose.orient(lin_g, \"right\")}"
      - lin_j: "{pose.orient(lin_j, \"back-right\")}"
      - lin_m: "{pose.orient(lin_m, \"back\")}"
      - lin_p: "{pose.orient(lin_p, \"back-left\")}"
      - lin_s: "{pose.orient(lin_s, \"left\")}"
      - lin_v: "{pose.orient(lin_v, \"front-left\")}"
      - lin_a: "八向朝向展示。"
