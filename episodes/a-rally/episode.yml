episode:
  id: a_rally
  title: 羽毛球：一次回合（切片 A）
  language: zh-CN

# Slice A / milestone S-A2: the accepted serve, and the rally R8 made
# authorable. The measurements, the cue band and the rejected branches are in
# README.md; this file is the authored intent only.
#
# THE ACCEPTED PREAMBLE IS BACK. The shot keeps a-badminton's pickup and is the
# accepted serve exactly (projectile.struck 2.307 s [-533,-447] from the palm):
# a shuttle started `held-by` would be struck 84 px higher and its ink would
# reach the server's chin.
#
# COURT DISTANCE. The receiver stays at the accepted `background` lane (x 672,
# scale 0.722, envelope 113 px), 574 px from the server. R8's interception walks
# him the ~100 px to the descending shuttle and meets it at the cork.
#
# TIMING. The DSL has no explicit cue time: a beat happens where it sits in the
# cursor, and the cursor advances by the durations before it. The receiver's
# push therefore sits on its own beat 10 ms after the serve's cue — a
# `movement.to(receiver, receiver)` no-op with durationSec 0.010, because state
# calls advance no cursor and a `…` beat is 0.55 s. Both pushes on the serve's
# own cue was measured and silently drops the return (one strike, the serve; no
# diagnostic at all), which is why the 10 ms spacer stays. The same push also
# declares `durationSec: 0.60` so the cursor reaches the camera's let-go beat at
# 2.91 s; the push's motor beat is its recipe's 2.2 s whatever this declares.
#
# CAMERA. Three framings, one shot: the composition's full-stage wide opens the
# shot and carries the pickup; `camera.punch_in(receiver, 1.3)` runs over the
# pickup's last 0.65 s (1.65-2.30) and holds a medium two-shot (both heads
# whole, the pair fitted, the feet cut) through the serve, the return's contact
# and the first part of the return; `camera.wide()` (2.91-3.71) pulls back to
# the full court for the landing and the tail. Frame 0 is the wide — no
# wide-to-follow flash. No drawn head is sliced in any frame.
actors:
  server:
    use: figure/athlete_a
    voice: voice/zh/student_a
  receiver:
    use: figure/athlete_a
    voice: voice/zh/aqiang

locations:
  hall:
    use: set/badminton_hall

objects:
  shuttle:
    use: prop/shuttle
  racket:
    use: prop/racket

scenes:
  - id: rally
    location: hall
    actors:
      server: {facing: left}
      receiver: {facing: right, entrance: background}
    objects:
      shuttle: center
      racket: held-by(server, left)
    script:
      - server: "{pose.orient(server, \"left\")}{pose.orient(receiver, \"right\")}"
      # 1 pick up — three silent beats (1.65 s) keep the serve after the grab.
      - server: "{prop.pickup(server, shuttle)}………"
      # 2 push in — the medium two-shot that carries the serve and the return.
      - server: "{camera.punch_in(receiver, 1.3)}"
      # 3 serve — the accepted strike; the camera holds the pushed framing.
      - server: "{...action.push(server, shuttle, 1.0, 0.16), mode: \"nonblock\"}"
      # 4 the return, 10 ms after the serve's cue (see TIMING above).
      - receiver: "{...movement.to(receiver, receiver), durationSec: 0.010}"
      - receiver: "{...action.push(receiver, shuttle, 1.0, 0.16), durationSec: 0.60}"
      # 5 let go — pull back to the wide for the return's landing and the tail.
      - server: "{camera.wide()}"
